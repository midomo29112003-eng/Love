<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  color: white;
  margin: 0;
  height: 100vh;
  overflow: hidden;

  background: linear-gradient(-45deg, #ff4d6d, #ffb3c1, #cdb4db, #bde0fe);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

@keyframes gradient {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

input, button {
  padding: 12px;
  margin: 10px;
  border-radius: 12px;
  border: none;
}

button {
  background: white;
  color: #ff4d6d;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

img {
  margin-top: 20px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(255,255,255,0.5);
  width: 250px;
}

/* قلوب */
.heart {
  position: absolute;
  color: white;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% {transform: translateY(100vh); opacity: 1;}
  100% {transform: translateY(-10vh); opacity: 0;}
}

/* الرسالة */
#msg {
  width: 80%;
  line-height: 1.8;
}
</style>

</head>

<body>

<h2>Enter Password 🔐</h2>

<input type="password" id="pass" placeholder="Password">
<br>
<button onclick="check()">Open ❤️</button>

<div id="content" style="display:none;">

<h2 id="msg"></h2>

<img src="photo.jpg">

<br><br>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

</div>

<script>
function check(){
  let p = document.getElementById("pass").value;

  if(p === "1552025"){
    document.getElementById("content").style.display = "block";

    document.getElementById("music").play().catch(()=>{});

    typeWriter();
  } else {
    alert("Wrong Password ❌");
  }
}

/* الرسالة بتتكتب */
let text = `عاملة اي يتوتي الفترة الاخيرة مكنتش احسن حاجة بينا ومرينا فيها بحاجات كتير صعبة بس على اد ما اتضايقنا بس فرحت ان حتى لما حد فينا كان بيقرر يبعد كان بيرجع تاني ومش بيقدر يكمل وبنختار بعض زي النهارده كانت اول مرة اكلمك وقتها كنت مستغربك شوية وكنت قلقان منك انت عارفة😂♥️ بس بعد كده كل ده اتغير في شهر بقيتي احلى حاجة حصلتلي في حياتي وبقيت جزء من قلبي ده لو مش قلبي كله بجد من احسن السنين اللي مريت عليا وان شاء الله متكونش اخر سنة ولا حاجة ونكمل بقيت عمرنا سوا انا بحبك اوي بجد وعايز اعمل اي حاجة عشانك وعشان تكوني مبسوطة وفرحانة وبتضحكي دايما ربنا يديمك ليا يحياتي ويحفظك من كل سوء واشوفك انجح الناس واشوف مبسوطة دايما بحبك اوي يتوتي😘♥️♥️`;

let i = 0;

function typeWriter(){
  if(i < text.length){
    document.getElementById("msg").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 25);
  }
}

/* قلوب */
function createHearts(){
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHearts, 300);
</script>

</body>
</html>
